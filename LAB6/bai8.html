<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dự đoán nghề nghiệp</title>
  </head>
  <body>
    <h2>Chương trình dự đoán nghề nghiệp</h2>
    <label for="tenNguoiDung">Nhập tên của bạn:</label>
    <input type="text" id="tenNguoiDung" placeholder="Nhập tên..." />
    <button onclick="duDoanNgheNghiep()">Dự đoán</button>
    <h3 id="ketqua"></h3>
    <script>
      function duDoanNgheNghiep() {
        const ten = document.getElementById("tenNguoiDung").value.trim();
        const danhSachNghe = [
          "Lập trình viên",
          "Bác sĩ",
          "Giáo viên",
          "Kỹ sư",
          "Nhà thiết kế",
          "Đầu bếp",
          "Nhiếp ảnh gia",
          "Doanh nhân",
        ];
        if (ten === "") {
          document.getElementById("ketqua").innerHTML =
            "Vui lòng nhập tên của bạn!";
          return;
        }
        const viTriNgauNhien = Math.floor(Math.random() * danhSachNghe.length);
        const ngheNghiep = danhSachNghe[viTriNgauNhien];
        document.getElementById("ketqua").innerHTML =
          `Xin chào ${ten}! Nghề nghiệp tương lai của bạn có thể là: ${ngheNghiep}.`;
      }
    </script>
  </body>
</html>
