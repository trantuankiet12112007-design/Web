<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tính chỉ số BMI</title>
  </head>
  <body>
    <h1>Tính chỉ số BMI</h1>
    <label>Chiều cao (m):</label>
    <input type="number" id="cao" step="any" />
    <br /><br />
    <label>Cân nặng (kg):</label>
    <input type="number" id="nang" step="any" />
    <br /><br />
    <button onclick="tinhBMI()">Tính BMI</button>
    <p id="ketqua"></p>
    <script>
      function tinhBMI() {
        let cao = Number(document.getElementById("cao").value);
        let nang = Number(document.getElementById("nang").value);

        if (
          document.getElementById("cao").value === "" ||
          document.getElementById("nang").value === ""
        ) {
          document.getElementById("ketqua").innerHTML =
            "Vui lòng nhập đầy đủ chiều cao và cân nặng.";
          return;
        }

        if (cao <= 0 || nang <= 0) {
          document.getElementById("ketqua").innerHTML = "Dữ liệu không hợp lệ.";
          return;
        }

        let bmi = nang / (cao * cao);
        let ketluan;

        if (bmi < 18.5) {
          ketluan = "Gầy";
        } else if (bmi < 25) {
          ketluan = "Bình thường";
        } else if (bmi < 30) {
          ketluan = "Thừa cân";
        } else {
          ketluan = "Béo phì";
        }

        document.getElementById("ketqua").innerHTML =
          "BMI: " + bmi.toFixed(2) + " - " + ketluan;
      }
    </script>
  </body>
</html>
