<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>Chương trình tình yêu</h2>
    <label for="">Nhập tên bạn: </label>
    <input type="text" id="tenban" />
    <br />
    <label for="">Nhập tên người ấy: </label>
    <input type="text" id="tennguoiay" />
    <br /><br />
    <button onclick="xemBoi()">Xem kết quả</button>
    <h3 id="ketqua"></h3>

    <script>
      function xemBoi() {
        let tenban = document.getElementById("tenban").value;
        let tennguoiay = document.getElementById("tennguoiay").value;
        let diem = Math.floor(Math.random() * 100) + 1;
        if (diem > 50) {
          document.getElementById("ketqua").innerHTML =
            tenban +
            "❤️" +
            tennguoiay +
            "Điểm: " +
            diem +
            "Chúc mừng. Hai bạn rất hợp";
        } else {
          document.getElementById("ketqua").innerHTML =
            tenban +
            "❤️" +
            tennguoiay +
            "Điểm: " +
            diem +
            "Chia tay sớm bớt đau khổ";
        }
      }
    </script>
  </body>
</html>
