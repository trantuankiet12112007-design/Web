<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lịch Học</title>
    <style>
      table {
        border-collapse: collapse;
      }
      th,
      td {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1 align="center">LỊCH HỌC</h1>
    <table border="1" align="center" cellpadding="10" cellspacing="1">
      <tr>
        <th>Thứ</th>
        <th>Hai</th>
        <th>Ba</th>
        <th>Tư</th>
        <th>Năm</th>
        <th>Sáu</th>
      </tr>

      <tr>
        <td rowspan="2">Sáng</td>
        <td>LTHDT</td>
        <td rowspan="2">CTDL-GT</td>
        <td rowspan="2">PTHT</td>
        <td>CSDL</td>
        <td rowspan="2">CSDL</td>
      </tr>

      <tr>
        <td>LTW</td>
        <td>LTW</td>
      </tr>

      <tr>
        <td rowspan="2">Chiều</td>
        <td>TDTT</td>
        <td>QTW</td>
        <td>TRR</td>
        <td colspan="2">TDTT</td>
      </tr>

      <tr>
        <td colspan="2">AV</td>
        <td>CSDL</td>
        <td colspan="2">CNTT CB</td>
      </tr>
    </table>
  </body>
</html>
